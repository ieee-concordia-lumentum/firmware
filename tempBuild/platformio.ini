; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_receiver, esp32_sender


[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 460800

[env:esp32_sender]
build_flags =
    -DSENDER
build_src_filter =
    -<*>
    +<MCU/main.cpp>
    +<protocol.c>
    +<platform/esp32/hardwareESP32.cpp>

[env:esp32_receiver]
build_flags =
    -DRECEIVER
build_src_filter =
    -<*>
    +<MCU/main.cpp>
    +<protocol.c>
    +<platform/esp32/hardwareESP32.cpp>

; Hardware-UART prototype. The original esp32_sender/receiver remain the fallback.
[env:esp32_uart_sender]
build_flags =
    -DSENDER
    -DPROTOCOL_UART_TRANSPORT
build_src_filter =
    -<*>
    +<MCU/main.cpp>
    +<uart_link.c>
    +<platform/esp32/uartTransport.cpp>

[env:esp32_uart_receiver]
build_flags =
    -DRECEIVER
    -DPROTOCOL_UART_TRANSPORT
build_src_filter =
    -<*>
    +<MCU/main.cpp>
    +<uart_link.c>
    +<platform/esp32/uartTransport.cpp>
